version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai-code-review-db
    environment:
      POSTGRES_USER: ai_reviewer
      POSTGRES_PASSWORD: dev_password_123
      POSTGRES_DB: ai_code_review
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_reviewer"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: